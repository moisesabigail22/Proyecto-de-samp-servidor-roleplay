echo Executing Server Config...
lanmode 0
rcon_password 1234
maxplayers 100
port 7777
hostname Nova Roleplay | Servidor RolePlay
gamemode0 rpgm 1
filterscripts 
announce 0
query 1
weburl nova-roleplay.local
onfoot_rate 40
incar_rate 40
weapon_rate 40
stream_distance 300.0
stream_rate 1000
maxnpc 0
logtimeformat [%H:%M:%S]
language Español
plugins mysql streamer sscanf crashdetect whirlpool

